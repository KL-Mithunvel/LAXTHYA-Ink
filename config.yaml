# Default configuration. Every tunable lives here (CLAUDE-COMMON: no hardcoded parameters).
#
# Machine-specific values (real COM port, the MEASURED pen offset and pen-down Z)
# belong in a git-ignored config.local.yaml next to this file; it is deep-merged
# over these defaults at load time. Do not commit a real port or a tuned Z here.

printer:
  port: auto            # 'auto' = find it by asking each port (M115); or COM3 / /dev/ttyUSB0
  baud: 115200          # Ender-3 V3 SE
  ack_timeout_s: 30     # no `ok` and no busy/wait for this long -> AckTimeout
  connect_settle_s: 2.0 # wait after opening the port before the M115 handshake

# Ender-3 V3 SE build volume (mm). Nozzle targets are checked against it.
machine:
  x_max: 220
  y_max: 220
  z_max: 250

# Writing area on the paper, in PEN-TIP bed coordinates (mm). Origin is the
# bottom-left corner of the area; y grows toward the back of the bed.
paper:
  origin_x: 40.0
  origin_y: 40.0
  width_mm: 140.0
  height_mm: 180.0

pen:
  # Pen tip position relative to the nozzle tip (mm): pen_tip = nozzle + offset.
  # MEASURE THIS on the real machine and override in config.local.yaml.
  offset_x: 0.0
  offset_y: 0.0
  # Nozzle Z at which the pen tip just touches the paper.
  # PROVISIONAL placeholder - not touching the paper. Measure it, put it in
  # config.local.yaml, and only then set down_z_calibrated: true (Dev Rule 4).
  down_z: 5.0
  down_z_calibrated: false
  lift_mm: 3.0          # pen-up height above down_z while travelling between strokes
  min_z: 0.0            # the planner never commands a Z below this
  down_dwell_ms: 0      # pause after lowering the pen (0 = none); lets a spring pen settle

writing:
  scale_mm_per_unit: 1.0     # stroke-file units -> mm (the writer's size, scaled)
  line_spacing_mm: 12.0      # baseline-to-baseline distance
  simplify_tolerance_mm: 0.05   # Ramer-Douglas-Peucker; 0 disables
  min_point_spacing_mm: 0.02    # drop points closer than this to the previous kept point

motion:
  draw_feed: 1200       # mm/min, pen down
  travel_feed: 6000     # mm/min, pen up
  z_feed: 600           # mm/min, pen lift / lower

park:
  x: 5.0                # nozzle position at the end of a job (or after a stop)
  y: 5.0
  safe_z: 20.0          # Z for homing exit, parking and safe-stop (must clear pen_up Z)

start:
  home: true            # send G28 at the start of a job

gcode:
  use_line_numbers: false   # N<n>/checksum + resend buffer instead of plain lines (unverified)

# Simulated printer (dev machine only).
sim:
  contact_tolerance_mm: 0.001   # Z within this of pen.down_z counts as pen-on-paper
  command_delay_s: 0.0          # sleep per line; non-zero makes a sim run take real time

# Handwriting capture server (the iPad web app talks to this).
capture:
  host: 0.0.0.0         # listen on the LAN so the iPad can reach this laptop; local network only
  port: 8000
  probe_dir: data/probe # where signal-probe uploads are saved (git-ignored); relative to the repo root
  max_upload_mb: 20     # reject larger uploads
  live_buffer_events: 30000  # pen events the live preview keeps in memory (not saved; the chunk upload is the record)
  live_idle_s: 20            # a session counts as "live" on the monitor if it sent pen events this recently
  db_path: data/capture.db        # SQLite store of writers, sessions and raw pen samples (git-ignored)
  backup_dir: data/backup         # compressed JSON copy of each session, one folder per writer (git-ignored)
  consent_version: "2026-10-31-v2" # bump whenever docs/CONSENT_FORM.md changes; stored with each writer
  prompt_set_id: core-v2           # which generated control text the capture app serves (capture/prompts/<id>.json)
  mm_per_css_px: 0.1924            # ASSUMED from the iPad Pro 11in (264 ppi, 2x scale): 25.4 / 132. Verify with a ruler
                                   # and override in config.local.yaml; stored with every session

# The control text every writer is asked to write (laxthya_ink/capture/prompts.py).
# Changing anything here changes the text: regenerate with `python -m laxthya_ink.capture.prompts`
# and bump capture.consent_version only if the consent wording changed.
prompts:
  seed: 20261030                   # fixed so the text is reproducible; reshuffles word/glyph order
  # English comes from real words only. A letter pair is "natural" if at least natural_min_words words of the
  # word list contain it; every natural pair is covered pair_min times. Rare pairs (bq, dq, ...) are left to the
  # extended session instead of being padded with made-up strings.
  word_list: data/wordlists/google-10000-english-no-swears.txt   # git-ignored; get it with tools/fetch_wordlist.py
  pool_size: 3000                  # use at most this many of the most frequent words (further down the list are brands and acronyms)
  natural_min_words: 3             # a pair is natural if this many pool words contain it
  min_word_length: 4               # shorter entries (of, to, tv, usb, ...) are not used
  max_consonant_run: 3             # a word needs a vowel (a e i o u y) and no more than this many consonants in a row,
                                   # which drops acronyms such as gtk, wto, xhtml
  pair_min: 2                      # every natural lowercase letter pair appears at least this often
  glyph_repeats: 3                 # each Greek letter, math symbol, punctuation mark, digit and Tamil letter
  chunk_units: 90                  # writing effort per chunk (1 unit = one Latin character); about a minute
  line_units: 30                   # writing effort per printed line
  units_per_glyph:                 # relative effort of one glyph; Tamil letters have more strokes
    latin: 1.0
    digit: 1.0
    symbol: 1.5
    greek: 1.5
    tamil: 2.5
  writing_units_per_minute: 90     # ASSUMPTION used only for the time estimate - measure on the first writers
  break_every_chunks: 8            # the page suggests a short break after this many chunks
  max_pending_chunks: 3            # the page waits for the laptop if this many chunks are still unsent
